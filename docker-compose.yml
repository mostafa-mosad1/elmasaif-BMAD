
services:
  postgres:
    image: postgres:16-alpine
    container_name: elmasaif-postgres
    restart: always
    environment:
      POSTGRES_USER: elmasaif_user
      POSTGRES_PASSWORD: elmasaif_password
      POSTGRES_DB: elmasaif_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - elmasaif-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elmasaif_user -d elmasaif_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: pgsty/silo:latest
    container_name: elmasaif-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniopassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - elmasaif-network

  minio-init:
    image: pgsty/silo:latest
    container_name: elmasaif-minio-init
    depends_on:
      - minio
    networks:
      - elmasaif-network
    entrypoint: >
      /bin/sh -c "
      until (mcli alias set local http://minio:9000 minioadmin miniopassword); do
        echo 'Waiting for MinIO...';
        sleep 1;
      done;
      mcli mb --ignore-existing local/elmasaif-private-documents;
      mcli anonymous set none local/elmasaif-private-documents;
      echo 'MinIO initialized successfully with private bucket: elmasaif-private-documents';
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: elmasaif-mailpit
    restart: always
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - elmasaif-network

  # Optional ClamAV daemon for local verification with real antivirus engine (NFR13)
  # To run with ClamAV: docker compose --profile security up -d
  clamav:
    image: clamav/clamav:latest
    container_name: elmasaif-clamav
    restart: unless-stopped
    profiles:
      - security
    ports:
      - "3310:3310"
    networks:
      - elmasaif-network

volumes:
  postgres_data:
  minio_data:

networks:
  elmasaif-network:
    driver: bridge
